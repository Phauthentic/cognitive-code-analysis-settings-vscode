name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test only, do not publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      RUN_FLAGS: -T
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag matches package.json version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run on a branch: skipping tag check."
              exit 0
            fi
            echo "::error::Publishing requires a v* tag."
            exit 1
          fi
          version="$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tagged commit $GITHUB_SHA is not on master."
            exit 1
          fi

      - name: Use the runner's UID/GID inside the container
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dev/Dockerfile
          build-args: |
            UID=${{ env.HOST_UID }}
            GID=${{ env.HOST_GID }}
          tags: cognitive-code-analysis-vscode-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install, lint, compile and test
        run: make install lint compile test

      - name: Package
        run: make package

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error

      # The publish steps are independent and idempotent (--skip-duplicate), so a failed run can simply be re-run.
      # continue-on-error lets every step try; the last step fails the job if any of them failed.
      - name: Publish to VS Code Marketplace
        id: vsce
        if: env.DRY_RUN != 'true'
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: make publish-vsce

      - name: Publish to Open VSX
        id: ovsx
        if: env.DRY_RUN != 'true'
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: make publish-ovsx

      - name: Create GitHub Release
        id: gh_release
        if: env.DRY_RUN != 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.vsix
          generate_release_notes: true

      - name: Fail if any publish step failed
        if: env.DRY_RUN != 'true' && (steps.vsce.outcome == 'failure' || steps.ovsx.outcome == 'failure' || steps.gh_release.outcome == 'failure')
        run: |
          echo "::error::vsce=${{ steps.vsce.outcome }} ovsx=${{ steps.ovsx.outcome }} release=${{ steps.gh_release.outcome }}"
          exit 1
